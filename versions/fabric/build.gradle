plugins {
    id 'fabric-loom' version "${fabric_loom_version}"
    id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_version}-fabric"
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}"
}

// Pull in the shared (loader-agnostic) sources and resources from /common
sourceSets {
    main {
        java {
            srcDir rootProject.file('common/src/main/java')
        }
        resources {
            srcDir rootProject.file('common/src/main/resources')
        }
    }
}

def voxyJars = fileTree(dir: 'libs', include: ['voxy*fabric*.jar', 'voxy*.jar'])
tasks.matching { it.name == 'compileJava' }.configureEach {
    doFirst {
        if (voxyJars.isEmpty()) {
            // \u001B[31m / \u001B[0m are ANSI codes that color this message red in
            // Gradle's rich console, matching the FAILURE/BUILD FAILED lines around it.
            // Terminals without ANSI support just show the raw text — harmless either way.
            throw new GradleException(
                "\u001B[31m" +
                "No voxy jar found in versions/fabric/libs/. Download and build the Voxy Backport (Fabric) " +
                "from https://github.com/m3t4f1v3/voxy/tree/multiversion " +
                "and place the jar in versions/fabric/libs/ before building. See README.md." +
                "\u001B[0m"
            )
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Compile-only: we patch Voxy's class at runtime, we never bundle it.
    // Resolved from versions/fabric/libs/*.jar — see the voxyJars check above.
    modCompileOnly voxyJars
}

def expandProps = [
    "version": mod_version,
    "mod_id": mod_id,
    "voxy_min_version": voxy_min_version
]

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand expandProps
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from(file("../../LICENSE")) {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.base.archivesName.get()
            from components.java
        }
    }
    repositories {
        // Add publishing repositories here if needed.
    }
}
