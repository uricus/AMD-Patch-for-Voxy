# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
# Only configures the subproject(s) actually needed for the requested task(s) — e.g.
# `gradlew :neoforge:build` won't also configure (and trigger Loom's Minecraft
# remapping for) the :fabric subproject.
org.gradle.configureondemand=true

# Minecraft / Mod metadata (shared across loaders)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)

mod_id=amd_patch_for_voxy
mod_version=1.0.0
maven_group=com.amdfix
archives_base_name=amd_patch_for_voxy
mod_name=AMD Patch for Voxy
mod_description=Fixes rendering issues on AMD GPUs for the Voxy backport (Fabric & NeoForge, 1.21.1).
mod_authors=uricus
mod_license=GPL-3.0-only

# Fabric
fabric_loader_version=0.16.9
fabric_api_version=0.107.0+1.21.1
fabric_loom_version=1.16.2
yarn_mappings=1.21.1+build.3

# NeoForge
neoforge_version=21.1.230
neogradle_version=7.0.180
neoforge_loader_version_range=[4,)

# Voxy backport (m3t4f1v3/voxy, "multiversion" branch) is NOT published to Modrinth or
# any Maven repo — only distributed as GitHub Release jars / built from source.
# So it can't be pulled as a normal Gradle dependency. Instead:
#   1. Get the two loader jars (build them yourself from the multiversion branch, or
#      download prebuilt jars from the repo's GitHub Releases if available), and
#   2. Drop them into versions/fabric/libs/ and versions/neoforge/libs/ respectively
#      (see each subproject's build.gradle "compileOnly files(...)" dependency).
# This property is only used for the runtime "depends on voxy >= X" version check
# written into fabric.mod.json / neoforge.mods.toml — it does NOT need to resolve
# anywhere at build time.
voxy_min_version=0.2.15-beta

